<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Sentiment Pipeline</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="site-header-text">
        <div class="title-row">
          <img class="site-icon" src="favicon.svg" alt="" width="32" height="32">
          <h1>News Sentiment Pipeline</h1>
        </div>
        <p class="subtitle">
          Financial news, scored for sentiment and backtested against historical prices.
        </p>
      </div>
      <a class="repo-link" href="https://github.com/LucasKniska/News-Sentiment-Pipeline" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13

            .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
            -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27

        </svg>

    </header>

    <main>
      <section class="dashboard-card">
        <div id="status" class="status" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span class="status-text">Loading dashboard&hellip;</span>
        </div>
        <div id="dashboard-container"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Ingestion &rarr; LangChain sentiment extraction &rarr; Databricks backtest, served from AWS.
        Dashboard embedded live from Databricks.
      </p>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
