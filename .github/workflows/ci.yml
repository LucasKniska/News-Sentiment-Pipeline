name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run black --check .

  lint-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: terraform
      # terraform validate is intentionally NOT run here: it needs
      # terraform/variables.tf, which is gitignored (holds real credential
      # defaults) and doesn't exist on a fresh CI checkout - every var.*
      # reference across the *.tf files would fail as an undeclared input.
