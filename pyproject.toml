[project]
name = "news-sentiment-pipeline"
version = "0.1.0"
description = "Financial news ingestion, sentiment extraction, and backtesting pipeline"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.51",
    "finnhub-python>=2.4.29",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "trafilatura>=2.1.0",
]

[tool.uv]
package = false

[dependency-groups]
langchain = [
    "groq>=0.37.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-groq>=1.1.3",
    "pydantic>=2.13.4",
]
