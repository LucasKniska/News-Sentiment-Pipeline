[project]
name = "news-sentiment-pipeline"
version = "0.1.0"
description = "Financial news ingestion, sentiment extraction, and backtesting pipeline"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.51",
    "finnhub-python>=2.4.29",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "trafilatura>=2.1.0",
]

[tool.uv]
package = false

[tool.black]
target-version = ["py313"]

[dependency-groups]
# psycopg/boto3 are duplicated from [project.dependencies] (not group-exclusive)
# so `uv export --only-group langchain` produces a complete, standalone
# requirements.txt for the sentiment_analysis Lambda's build.ps1 - without
# pulling in news_ingestion-only deps like trafilatura/finnhub-python, which
# --group (as opposed to --only-group) would.
langchain = [
    "boto3>=1.43.51",
    "groq>=0.37.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-groq>=1.1.3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
]
# yfinance is price_backfill-only; kept out of [project.dependencies] so a
# plain `uv export` for news_ingestion/sentiment_analysis doesn't drag in
# yfinance's tree (pandas, numpy, curl_cffi, protobuf, ...) unnecessarily.
price_backfill = [
    "psycopg[binary]>=3.3.4",
    "yfinance>=1.5.2",
]
# boto3/psycopg duplicated from [project.dependencies] (not group-exclusive,
# same reasoning as the langchain group above) so `uv export --only-group api`
# produces a standalone requirements.txt for the api Lambda's build.ps1
# without pulling in trafilatura/finnhub-python/pydantic/python-dotenv, which
# a plain `uv export` would.
api = [
    "boto3>=1.43.51",
    "psycopg[binary]>=3.3.4",
]
dev = [
    "black>=26.5.1",
]
